[project]
name = "ai-cfd-platform"
version = "0.1.0"
description = "AI-Powered Computational Fluid Dynamics Platform"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"